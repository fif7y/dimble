name: Pelmet
options:
  bundleIdPrefix: app.fif7y
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  PelmetCore:
    path: Packages/PelmetCore
  PelmetEngine:
    path: Packages/PelmetEngine
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0
schemes:
  Pelmet:
    build:
      targets:
        Pelmet: all
    test:
      targets:
        - PelmetTests
targetTemplates:
  SectionHelper:
    type: application
    platform: macOS
    sources:
      - PelmetItems
    dependencies:
      - package: PelmetCore
    info:
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        MARKETING_VERSION: "0.3.4-beta.2"
        CURRENT_PROJECT_VERSION: "83"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_APP_SANDBOX: "NO"
        SKIP_INSTALL: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YW9UY68SQ7
targets:
  Pelmet:
    type: application
    platform: macOS
    sources:
      - Pelmet
    dependencies:
      - package: PelmetCore
      - package: PelmetEngine
        product: PelmetEngine
      - package: Sparkle
        product: Sparkle
      - target: PelmetItemsHidden
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: PelmetItemsAlwaysHidden
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    postBuildScripts:
      # This version's notes ship inside the app for About's "What's new"
      # (same snippet release.sh embeds in the appcast).
      - name: Bundle release notes
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/release-notes-html.py
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ReleaseNotes.html
        script: |
          NOTES="$SRCROOT/docs/release-notes/v$MARKETING_VERSION.md"
          OUT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ReleaseNotes.html"
          if [ -f "$NOTES" ]; then
            /usr/bin/python3 "$SRCROOT/scripts/release-notes-html.py" "$NOTES" "$OUT"
          else
            echo "warning: no $NOTES, About shows no What's new"
            rm -f "$OUT"
          fi
    info:
      path: Pelmet/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Gabriel Faucon"
        CFBundleName: Dimble
        CFBundleDisplayName: Dimble
        SUFeedURL: https://fif7y.github.io/updates/pliss/appcast.xml
        SUPublicEDKey: HyfGTw9yRC/C2CUxxamEhzxZuK+WWuG7WPI6F+BUOgE=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fif7y.Pelmet
        # The app is called Dimble (Pelmet until 0.3.1, Pliss in the 0.3.2 betas): the product, its
        # executable and its Info.plist names change; the bundle id, the
        # Swift module (@testable import Pelmet) and every key stay.
        PRODUCT_NAME: Dimble
        PRODUCT_MODULE_NAME: Pelmet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.3.4-beta.2"
        CURRENT_PROJECT_VERSION: "83"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_APP_SANDBOX: "NO"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YW9UY68SQ7
  # Section helpers (docs/HELPER-PROCESS-PLAN.md): one bundle id per
  # concealable section so the per-bundle assertion can hide their items.
  # Same source, two bundles.
  PelmetItemsHidden:
    templates: [SectionHelper]
    info:
      path: PelmetItems/Info-Hidden.plist
      properties:
        CFBundleName: Dimble Items
        CFBundleDisplayName: Dimble Items
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fif7y.Pelmet.items.hidden
        PRODUCT_NAME: DimbleItems-Hidden
  PelmetItemsAlwaysHidden:
    templates: [SectionHelper]
    info:
      path: PelmetItems/Info-AlwaysHidden.plist
      properties:
        CFBundleName: Dimble Items
        CFBundleDisplayName: Dimble Items
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fif7y.Pelmet.items.alwaysHidden
        PRODUCT_NAME: DimbleItems-AlwaysHidden
  PelmetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PelmetTests
    dependencies:
      - target: Pelmet
    settings:
      base:
        # xcodegen derives the host from the target name; the product is Dimble.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Dimble.app/Contents/MacOS/Dimble
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YW9UY68SQ7
